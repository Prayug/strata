[project]
name = "strata"
version = "0.10.0"
description = "Strata: event-driven options backtesting and research platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "polars>=1.5",
  "numpy>=1.26",
  "numba>=0.60",
  "duckdb>=1.2",
  "pyarrow>=16",
  "scipy>=1.13",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "anthropic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "hypothesis>=6.100"]
databento = ["databento>=0.40"]
ml = ["scikit-learn>=1.5"]

[project.scripts]
strata = "strata.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
