name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: "Also run the live provider tests and `strata validate` (needs network; keys are optional)"
        type: boolean
        default: false
  schedule:
    - cron: "17 13 * * 1" # Mondays: live validation against the free providers

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e "backend[dev,ml]"
      - name: Tests (offline; nothing is downloaded and no credential store is touched)
        working-directory: backend
        run: python -m pytest -p no:warnings -q

  reproducibility:
    name: Reproducibility and look-ahead
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e "backend[dev,ml]"
      - name: Same request, same data, same answer; no future information
        working-directory: backend
        run: |
          python -m pytest -p no:warnings -q tests/test_reproducibility.py tests/test_lookahead_repro.py
          # and across two separate processes
          python -m pytest -p no:warnings -q tests/test_reproducibility.py

  benchmarks:
    name: Performance benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e "backend[dev,ml]"
      - name: Time the research workloads against the committed baseline
        working-directory: backend
        env:
          # each workload is measured against the rest of its own run and the whole suite against a calibration loop,
          # but a shared runner is still noisier than a laptop
          STRATA_BENCH_TOLERANCE: "3.0"
        run: python -m strata.cli bench --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmarks
          path: benchmarks/history.jsonl
          retention-days: 30

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Type check
        working-directory: frontend
        run: pnpm typecheck
      - name: Build
        working-directory: frontend
        run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: pip install -e "backend[dev,ml]"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Install the test browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Run (seeded fixture store, downloads off)
        working-directory: frontend
        env:
          STRATA_PYTHON: python
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  live:
    name: Live providers (optional)
    # never part of a pull request: only on the weekly schedule or when asked for by hand
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STRATA_LIVE: "1"
      STRATA_SECRET_STORE: file
      # optional: a provider whose key is not configured reports itself as skipped
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e "backend[dev,ml]"
      - name: Provider tests
        working-directory: backend
        run: python -m pytest -p no:warnings -rs tests/test_live.py
      - name: End-to-end validation on real observations (free, keyless sources only)
        working-directory: backend
        run: python -m strata.cli validate --json
